<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="main-card">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 id="studentName"></h5>
                        <span class="badge bg-danger fs-6">
                            Time: <span id="timer">30</span>s
                        </span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span id="questionNumber"></span>
                        <span id="progressText">0%</span>
                    </div>

                    <div class="progress mb-4">
                        <div id="progressBar" class="progress-bar" style="width: 0%">
                        </div>
                    </div>

                    <h4 id="questionText" class="mb-4"></h4>

                    <div id="answersContainer"></div>

                    <div id="quizMessage" class="alert mt-3" style="display: none;">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button id="previousBtn" class="btn btn-secondary" disabled>
                            Previous
                        </button>

                        <button id="nextBtn" class="btn btn-primary" disabled>
                            Next
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/quiz.js"></script>

</body>

</html>
