<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="main-card text-center">
                    <h2 class="page-title">
                        Quiz Completed!
                    </h2>
                    <h5 class="mb-4">
                        Congratulations, <span id="resultName"></span>
                    </h5>
                    <div class="mb-4">
                        <h1 class="display-3 fw-bold text-primary" id="finalScore">
                            0 / 10
                        </h1>
                        <p class="text-muted">
                            Your Final Score
                        </p>
                    </div>
                    <div class="mb-3">
                        <h4 id="percentage">
                            0%
                        </h4>
                        <p class="text-muted">
                            Percentage
                        </p>
                    </div>
                    <div id="resultStatus" class="alert">
                    </div>
                    <div class="d-grid gap-2">
                        <button id="tryAgainBtn" class="btn btn-custom">
                            Try Again
                        </button>
                        <button id="logoutBtn" class="btn btn-outline-danger">
                            Logout
                        </button>
                    </div>
                </div>
                <div class="container pb-5">
                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <div class="main-card mt-4">
                                <h4 class="page-title">My Quiz History</h4>
                                <div id="historyContainer"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/result.js"></script>

</body>

</html>
